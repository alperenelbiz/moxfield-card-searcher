[project]
name = "moxfield-compare"
version = "0.1.0"
description = "Compare an MTG card list against a Moxfield collection CSV"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
moxfield-compare = "moxfield_compare.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxfield_compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
